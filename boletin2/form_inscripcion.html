<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
  </head>
  <body>
    <form action="https://lm.ciclo.iesnervion.es/inscripcion.php" method="POST" enctype="multipart/form-data">
      <label for="equipo">Nombre del equipo:</label>
      <input type="text" name="equipo" autofocus>
      <br>
      <label for="password">Contraseña:</label>
      <input type="password" name="password" required>
      <br>
      <label for="recordar">¿Recordar Sesión?</label>
      <input name="recordar" type="checkbox">
      <br>
      <button type="submit">Iniciar Sesión</button>
    </form>
  </body>
</html>
