<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
  </head>
  <body>
    <form action="https://lm.ciclo.iesnervion.es/login.php" method="POST">
      <fieldset>
        <legend>Datos Académicos</legend>
        <label for="nombre">Nombre y Apellidos</label>
        <input type="text" name="nombre" id="ciclo" required>
        <br>
        <label for="ciclo">Ciclo Formativo</label>
        <select name="ciclo" id="ciclo">
          <option value="DAM" selected>DAM</option>
          <option value="DAW">DAW</option>
          <option value="ASIR">ASIR</option>
      </fieldset>
      <fieldset>
        <label for="lenguaje">Lenguaje</label>
        <br>
        <input type="radio" id="lenguaje" name="lenguaje" value="Java">
        <label for="lenguaje">Java</label>
        <input type="radio" id="lenguaje" name="lenguaje" value="Python">
        <label for="lenguaje">Python</label>
        <input type="radio" id="lenguaje" name="lenguaje" value="C#">
        <label for="lenguaje">C#</label>
        <input type="radio" id="lenguaje" name="lenguaje" value="JavaScript">
        <label for="lenguaje">JavaScript</label>
        <br>
        <input type="checkbox" id="entornos" name="entornos" value="Linux"
        <label for="entornos">Linux</label>
        <input type="checkbox" id="entornos" name="entornos" value="Windows"
        <label for="entornos">Windows</label>
        <input type="checkbox" id="entornos" name="entornos" value="macOS"
        <label for="entornos">macOS</label>
        <br>
        <label for="comentarios">Comentarios / Experiencia previa: </label>
        <textarea rows="4" cols="40" placeholder="Mensaje" id="comentarios" name="comentarios" ></textarea>
      </fieldset>
      <button type="submit">Iniciar Sesión</button>
    </form>
  </body>
</html>
