<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
  </head>
  <body>
    <form action="https://lm.ciclo.iesnervion.es/login.php" method="POST">
      <fieldset>
        <legend>Datos Académicos</legend>
        <label for="nombre">Nombre y Apellidos</label>
        <input type="text" name="nombre" id="ciclo" required>
        <br>
        <label for="ciclo">Ciclo Formativo</label>
        <select name="ciclo" id="ciclo">
          <option value="DAM" selected>DAM</option>
          <option value="DAW">DAW</option>
          <option value="ASIR">ASIR</option>
      </fieldset>
      <br>
      <fieldset>
        <label>Lenguaje</label>
        <input type="radio" id="Java" name="lenguaje" value="Java">
        <label for="Java">Java</label>
        <input type="radio" id="Python" name="lenguaje" value="Python">
        <label for="Python">Python</label>
        <input type="radio" id="C#" name="lenguaje" value="C#">
        <label for="C#">C#</label>
        <input type="radio" id="JavaScript" name="lenguaje" value="JavaScript">
        <label for="JavaScript">JavaScript</label>
        <br>
        
      </fieldset>
      <button type="submit">Iniciar Sesión</button>
    </form>
  </body>
</html>
