<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
  </head>
  <body>
    <form action="https://lm.ciclo.iesnervion.es/registro.php" method="POST">
      <label for="codigo">Código de Alumno:</label>
      <input type="text" name="codigo" placeholder="XXXYYY" pattern="[A-Z]{3}[0-9]{3}" required>
      <br>
      <label for="password">Contraseña:</label>
      <input type="password" name="password" required>
      <br>
      <label for="recordar">¿Recordar Sesión?</label>
      <input name="recordar" type="checkbox">
      <br>
      <button type="submit">Iniciar Sesión</button>
    </form>
  </body>
</html>
