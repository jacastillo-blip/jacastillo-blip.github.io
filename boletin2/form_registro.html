<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
  </head>
  <body>
    <form action="https://lm.ciclo.iesnervion.es/registro.php" method="POST">
      <label for="codigo">Código de Alumno:</label>
      <input type="text" name="codigo" placeholder="XXXYYY" pattern="[A-Z]{3}[0-9]{3}" required>
      <br>
      <label for="email">Correo corporativo:</label>
      <input type="email" name="email" placeholder="correo@paginaweb.com" required>
      <br>
      <label for="edad">Edad</label>
      <input name="edad" type="number" min="16" max="65">
      <br>
      <label for="telefono">Teléfono</label>
      <input name="telefono" type="tel" pattern="[0-9]{9}">
      <br>
      <label for="web">Sitio web / Portfolio</label>
      <input name="wev" type="url" placeholder="www.com">
      <br>
      <label for="ide">Selecciona una fruta:</label>
      <input list="ide" id="ide" name="ide" />
      <datalist id="ide">
        <option value="IntelliJ IDEA"></option>
        <option value="Visual Studio Code"></option>
        <option value="Eclipse"></option>
        <option value=" Android Studio"></option>
      </datalist>
      <button type="submit">Iniciar Sesión</button>
    </form>
  </body>
</html>
