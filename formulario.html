<!DOCTYPE>
<html>
  <head lang="es-ES">
    <meta charset="utf-8"/>
    <title>Formulario</title>
  </head>
  <body>
    <form action="htpps://w3schools.com/action_page.php" method="post">
      <fieldset>
      <legend>Información de contacto</legend>
      <label for="name">Nombre:</label>
      <input type="text" id="name" name="nombre"><br>
      <label for="email">Email:</label>
      <input type="email" id="email"><br>
      <label for="message">Mensaje:</label>
      <textarea id="message"></textarea>
      <select>
        <optgroup label="Frutas">
          <option value="manzana">Manzana</option>
          <option value="naranja">Naranja</option>
          <option value="platano" selected>Plátano</option>
        </optgroup>
        <optgroup label="Verduras">
          <option value="zanahoria">Zanahoria</option>
          <option value="brocoli">Brócoli</option>
          <option value="espinaca">Espinaca</option>
         </optgroup>
      </select>
      </fieldset>
      <input type="submit" value="Enviar">
    </form>
  </body>
</html>
